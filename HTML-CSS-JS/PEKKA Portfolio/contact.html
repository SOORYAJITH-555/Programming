
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Contact - pekkacoc</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .warning {
            font-size: large;
            color: red;
            display: none;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">PEKKA</a>
        <i class='bx bx-menu' id="menu-icon"></i>
        <nav class="navbar">
            <a href="home.html" class="active">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html" >Contact</a>
        </nav>
    </header>

    <section class="contact" id="contact">
        <h2 class="heading">Contact <span>Me!</span></h2>
        <form action="#">
            <div class="input-box">
                <input type="text" placeholder="Full Name" id="name">
                <span class="warning" id="name-warning">Please enter your Name</span>
            </div>
            <div class="input-box">
                <input type="email" placeholder="Email Address" id="email">
                <span class="warning" id="email-warning">Please enter your email</span>
            </div>
            <div class="input-box">
                <input type="number" placeholder="Mobile Number" id="num">
                <span class="warning" id="num-warning">Please enter your number</span>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Email Subject" id="sub">
                <span class="warning" id="sub-warning">Please enter your Subject</span>
            </div>
            <div class="input-box">
                <textarea name="message" id="message" cols="30" rows="10" placeholder="Your Message"></textarea>
                <span class="warning" id="message-warning">Please enter your message</span>
            </div>
            <input type="button" value="Send Message" class="btn" onclick="validate()">
            <p id="success-message" style="display: none; color: green;padding: 2rem;font-size: large;">Form submitted successfully!</p>
        </form>
    </section>

    <footer class="footer">
        <div class="footer-text">
            <div class="home-content">
                <div class="social-media">
                    <a href="https://www.facebook.com/ClashofClans/" target="_blank"><i class='bx bxl-facebook'></i></a>
                    <a href="https://www.instagram.com/ClashofClans/" target="_blank"><i class='bx bxl-instagram-alt'></i></a>
                    <a href="https://twitter.com/ClashofClans" target="_blank"><i class='bx bxl-twitter'></i></a>
                    <a href="https://www.linkedin.com/company/clashofclans" target="_blank"><i class='bx bxl-linkedin'></i></a>
                </div>
            </div>
            <p>Copyright &copy; 2021 clashofclans</p>
        </div>
        &nbsp;&nbsp;
        <div class="footer-iconTop">
            <a href="contact.html"><i class='bx bx-up-arrow-alt'></i></a>
        </div>
    </footer>

    <script lang="javascript">
        function validate() {
            var name = document.getElementById("name").value;
            var num = document.getElementById("num").value;
            var email = document.getElementById("email").value;
            var sub = document.getElementById("sub").value;
            var message = document.getElementById("message").value;

            if (name.length == 0) {
                document.getElementById("name-warning").style.display = "block";
                return;
            } else {
                document.getElementById("name-warning").style.display = "none";
            }

            if (num.length == 0) {
                document.getElementById("num-warning").style.display = "block";
                return;
            } else {
                document.getElementById("num-warning").style.display = "none";
            }

            if (email.length == 0) {
                document.getElementById("email-warning").style.display = "block";
                return;
            } else {
                document.getElementById("email-warning").style.display = "none";
            }

            if (sub.length == 0) {
                document.getElementById("sub-warning").style.display = "block";
                return;
            } else {
                document.getElementById("sub-warning").style.display = "none";
            }

            if (message.length == 0) {
                document.getElementById("message-warning").style.display = "block";
                return;
            } else {
                document.getElementById("message-warning").style.display = "none";
            }

            document.getElementById("success-message").style.display = "block";

             // Reset the form and hide warnings after a short delay
             setTimeout(function() {
                document.getElementById("name").value = "";
                document.getElementById("num").value = "";
                document.getElementById("email").value = "";
                document.getElementById("sub").value = "";
                document.getElementById("message").value = "";

                document.getElementById("success-message").style.display = "none";
                document.getElementById("name-warning").style.display = "none";
                document.getElementById("num-warning").style.display = "none";
                document.getElementById("email-warning").style.display = "none";
                document.getElementById("sub-warning").style.display = "none";
                document.getElementById("message-warning").style.display = "none";
            }, 3000); // Reset after 3 seconds
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
